data:
  start_year: 2000
  end_year: 2026
  cache_dir: data/raw
  processed_path: data/processed/matches.parquet
  include_lower_levels: true
  request_timeout_seconds: 45
  tier_overrides_path: null
  exact_dates_path: null

filters:
  context_dir: data/context
  fatigue_matches: 3
  fatigue_window_days: 4
  pre_slam_window_days: 14
  low_tier_before_slam: ["250", "Challenger", "ITF"]

features:
  initial_elo: 1500.0
  elo_k: 32.0
  surface_prior_matches: 20.0
  retirement_elo_weight: 0.25
  walkover_elo_weight: 0.0
  recent_form_half_life_days: 30.0
  h2h_min_matches: 3
  rest_days_cap: 60

model:
  model_type: boosted
  calibration: isotonic
  random_state: 27
  lightgbm_params:
    n_estimators: 350
    learning_rate: 0.035
    num_leaves: 24
    max_depth: 6
    min_child_samples: 80
    subsample: 0.85
    colsample_bytree: 0.85
    reg_alpha: 0.25
    reg_lambda: 1.0
    verbosity: -1

backtest:
  min_train_years: 3
  test_months: 3
  calibration_days: 180
  min_calibration_rows: 500
  edge_threshold: 0.02
  kelly_fraction: 0.25
  max_kelly_fraction: 0.05
  bootstrap_samples: 1000
  random_state: 27

odds:
  normalized_snapshots_path: null
  api_key_env: ODDS_API_KEY
  regions: us,uk,eu
  bookmakers: null

live_data:
  api_tennis_key_env: API_TENNIS_KEY
  timezone: America/New_York
  backfill_start: "2026-06-08"
  tournament_registry_path: data/metadata/tournaments.csv
  player_aliases_path: data/metadata/player_aliases.csv
  unresolved_fixtures_path: data/live/unresolved_fixtures.csv
  upcoming_days: 3
  replay_days: 7
  polymarket_refresh_seconds: 30
  polymarket_market_pages: 4
  polymarket_page_size: 100
  polymarket_max_markets_per_day: 60
  polymarket_book_batch_size: 50
  cold_start_min_matches: 8
  recommended_prediction_matches: 20
  recommended_surface_matches: 5
  max_player_staleness_days: 120

paper_trading:
  database_path: data/paper_trading.db
  default_stake: 5.0
  min_edge: 0.03
  kelly_multiplier: 0.25
  max_kelly_fraction: 0.05

history:
  start_date: "2023-01-01"
  raw_api_tennis_dir: data/raw/api_tennis
  normalized_api_tennis_path: data/normalized/api_tennis_matches.parquet
  unresolved_api_tennis_path: data/normalized/api_tennis_unresolved.csv
  tennis_data_directory: null
  tennis_data_snapshots_path: data/normalized/tennis_data_odds.parquet
  identity_database_path: data/identity.db
  merged_matches_path: data/processed/matches_full.parquet
  chronological_features_path: data/processed/features_full.parquet
  candidate_output_dir: outputs/candidate
  fuzzy_match_threshold: 96.0
  fuzzy_minimum_margin: 3.0
  max_retries: 4
  retry_backoff_seconds: 2.0
  sleep_between_requests: 0.25
  minimum_gate_segment_matches: 200
  gate_bootstrap_samples: 2000
  gate_confidence: 0.95

kaggle:
  enabled: true
  cli_executable: kaggle
  raw_root: data/raw/kaggle
  normalized_root: data/normalized/kaggle
  candidate_matches_database_path: data/candidate_matches.db
  atp_daily_slug: dissfya/atp-tennis-2000-2023daily-pull
  wta_daily_slug: dissfya/wta-tennis-2007-2023-daily-update
  huge_tennis_slug: guillemservera/tennis
  command_timeout_seconds: 1200
  accept_schema_change: false
