[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-moneyline-prediction"
version = "0.1.0"
description = "Leakage-safe ATP/WTA tennis probability modeling and odds backtesting pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.3",
  "lightgbm>=4.3",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "PyYAML>=6.0",
  "rapidfuzz>=3.6",
  "requests>=2.31",
  "scikit-learn>=1.4",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
tennis-download = "tennis_predictor.cli:download_main"
tennis-backtest = "tennis_predictor.cli:backtest_main"
tennis-predict = "tennis_predictor.cli:predict_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
